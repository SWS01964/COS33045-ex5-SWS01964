<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5 - Multi-chart page</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>TV Energy Consumption</h1>
    <nav>
      <a href="../index.html">&larr; Home</a>
      <a href="#bar">Screen type</a>
      <a href="#line">Electricity prices</a>
      <a href="#donut">Screen size</a>
    </nav>
  </header>

  <main>
    <section id="bar">
      <h2>Average energy consumption of 55" TVs by screen type</h2>
      <div id="bar-chart" class="responsive-svg-container"></div>
    </section>

    <section id="line">
      <h2>Average electricity spot price in Australia, 1998-2024</h2>
      <div id="line-chart" class="responsive-svg-container"></div>
    </section>

    <section id="donut">
      <h2>Proportion of TV models by screen size</h2>
      <div id="donut-chart" class="responsive-svg-container"></div>
    </section>
  </main>

  <footer>
    <p>COS30045 Data Visualisation</p>
  </footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/shared-constants.js"></script>
  <script src="js/bar-chart.js"></script>
  <script src="js/line-chart.js"></script>
  <script src="js/donut-chart.js"></script>
</body>
</html>
